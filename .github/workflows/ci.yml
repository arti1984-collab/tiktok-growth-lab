name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten
        run: npm ci

      - name: Typen
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Web-Build
        run: npm run build
